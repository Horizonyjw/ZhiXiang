# U-Net × radar_v1 正式联调配置
# data_version=radar_v1；数值为归一化灰度代理，不是物理 dBZ。

experiment_id: "20260812-unet-radar_v1-01"
model_name: unet
data_version: radar_v1
notes: "handoff 真实前向 + 小样本过拟合；physical_unit=normalized_grayscale_proxy_NOT_dBZ"

# ---- radar_v1 统一接口 ----
tin: 5
tout: 3
in_channels: 1
height: 352
width: 512
physical_unit: normalized_grayscale_proxy_NOT_dBZ

# ---- 模型结构 ----
base_channels: 32
depth: 4

# ---- 训练（handoff 过拟合）----
seed: 42
num_samples: 16
batch_size: 1
epochs: 40
learning_rate: 0.001
device: auto

# ---- 数据路径 ----
handoff_npz: "radar_v1/04_handoff/handoff_samples.npz"

# ---- 结果保存 ----
output_dir: "results/20260812-unet-radar_v1-01"
